name = "gear_train"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["crank", "hand"]

[[probes]]
name = "crank_turn_slow"
body = "crank"
local_point = [0, -0.051, -0.04]
displacement = [0.05, 0, 0]
ticks = 4000
settle_ticks = 1000

[[probes]]
name = "crank_turn_fast"
body = "crank"
local_point = [0, -0.051, -0.04]
displacement = [0.05, 0, 0]
ticks = 640
settle_ticks = 1600

[[probes]]
name = "crank_step"
body = "crank"
local_point = [0, -0.051, -0.04]
displacement = [-0.02, 0, 0]
ticks = 160
settle_ticks = 1600

[[probes]]
name = "hand_push"
body = "hand"
local_point = [0, -0.027, 0.06]
displacement = [0.03, 0, 0]
ticks = 800
settle_ticks = 1600

[[probes]]
name = "hand_push_fast"
body = "hand"
local_point = [0, -0.027, 0.06]
displacement = [-0.03, 0, 0]
ticks = 160
settle_ticks = 1600

# Private gear-train evaluation (src/sim2sim/gear_train.py; generated by experiments/validation/gear-scenes.py).
# cheap_gate_rad: worst probe error of shallow.xml with its lumped armature and damping each scaled by 0.9 or 1.1,
# at the source timestep 0.0005 s. shallow.xml runs at 0.01 s, the largest step whose probe error stays within the gate
# (probe error by timestep: 0.0005 s 7.21 rad, 0.001 s 7.02 rad, 0.002 s 7.32 rad, 0.004 s 7.31 rad, 0.005 s 7.02 rad, 0.008 s 7.23 rad, 0.01 s 7.13 rad).
[gear_train]
shallow_reference = "shallow.xml"
removals = ["gear_03", "gear_10", "gear_14"]
axle_tolerance_m = 0.015
cheap_gate_rad = 7.37
cost_runs = 5
cost_seconds = 1.0
cost_torque_nm = 0.02
