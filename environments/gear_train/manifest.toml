# Private gear-train evaluation (src/sim2sim/gear_train.py; generated by experiments/validation/gear-scenes.py).
# cheap_gate_rad: worst probe error of shallow.xml with its lumped armature and damping each scaled by 0.9 or 1.1,
# at the source timestep 0.0005 s. shallow.xml runs at 0.005 s, the largest step whose probe error stays within the gate
# (probe error by timestep: 0.0005 s 0.000172 rad, 0.001 s 0.000828 rad, 0.002 s 0.0251 rad, 0.004 s 0.0255 rad, 0.005 s 0.00586 rad, 0.008 s 0.0668 rad, 0.01 s 0.197 rad).
[gear_train]
shallow_reference = "shallow.xml"
removals = ["gear_03", "gear_10", "gear_14"]
axle_tolerance_m = 0.015
cheap_gate_rad = 0.02838
cost_runs = 5
cost_seconds = 1.0
cost_torque_nm = 0.02
