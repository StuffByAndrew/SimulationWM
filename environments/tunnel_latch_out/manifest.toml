name = "tunnel_latch_out"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["stick"]

object_bodies = ["stick"]
object_geoms = ["knob", "handle", "rod", "guide_collar", "guide_mid", "tip"]

[correspondence]
stick = "stick"

[reconstruction]
enabled = true
samples = 2048
seed = 20261109

# Private force-displacement probe (metric `force_profile`): grasp the knob top behind the post through its camera pixel (as an agent
# grasps; robust to a candidate built in a shifted frame), first slide it 240 mm along the trough into
# the bore at 50 mm/s (to the in-bore levels' rest pose), then push the stick through the gap and the full stroke twice slowly (latch
# branches), then once 10x faster (damping).
[force_profile]
grasp_pixel = [66, 182]
grasp_radius_px = 3
path = [[0.0000000, 0.0000000, 0.0000000], [0.0000000, 0.3010000, 0.0000000]]
strokes = [[0.2400000, 0.0500000], [0.3010000, 0.0100000], [0.2400000, 0.0100000], [0.3010000, 0.0100000], [0.2400000, 0.0100000], [0.3010000, 0.1000000], [0.2400000, 0.1000000]]
sample_ticks = 25
settle_ticks = 250
