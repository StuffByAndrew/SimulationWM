name = "msd_damper_hidden"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["block"]

object_bodies = ["block"]
object_geoms = ["block"]

[correspondence]
block = "block"

[reconstruction]
enabled = true
samples = 2048
seed = 20261116

# Pull the block 0.08 m along the slide axis over 0.8 s, release, and watch it oscillate for 0.8 s (about one period).
[[probes]]
name = "pull_release"
body = "block"
local_point = [0.0, 0.0, 0.03]
displacement = [0.08, 0.0, 0.0]
ticks = 400

# Private force-displacement probe (metric `force_profile`): grasp the block top through its camera pixel, then along the slide axis
# one slow (0.04 m/s) cycle out to +0.08 m, through rest to -0.08 m and back (spring slope k), then the same cycle at 0.5 m/s
# (damping b v = 0.4 N in the damper levels, plus inertia at the reversals).
[force_profile]
grasp_pixel = [177, 110]
grasp_radius_px = 3
path = [[0.0000, 0.0000, 0.0000], [0.0800, 0.0000, 0.0000], [-0.0800, 0.0000, 0.0000]]
strokes = [[0.0800, 0.0400], [0.2400, 0.0400], [0.1600, 0.0400], [0.0800, 0.5000], [0.2400, 0.5000], [0.1600, 0.5000]]
sample_ticks = 10
settle_ticks = 50
