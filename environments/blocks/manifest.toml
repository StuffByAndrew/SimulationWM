name = "blocks"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["block_red", "block_blue"]

[correspondence]
block_red = "block_red"
block_blue = "block_blue"

[[probes]]
name = "red_lift"
body = "block_red"
local_point = [0.0, 0.0, 0.06]
displacement = [0.0, 0.0, 0.15]
ticks = 120

[[probes]]
name = "blue_slide"
body = "block_blue"
local_point = [0.0, 0.0, 0.05]
displacement = [-0.15, 0.0, 0.0]
ticks = 120

# Private expert manipulation (metric `expert`) and policy-transfer task (metric `policy_transfer`).
[[expert_trajectories]]
name = "red_stack_on_blue"
frame_ticks = 10
actions = [{op = "grasp", body = "block_red", local_point = [0.0, 0.0, 0.06]},
           {op = "move", displacement = [0.0, 0.0, 0.2], ticks = 100},
           {op = "move", displacement = [0.33, 0.08, 0.0], ticks = 150},
           {op = "release", ticks = 50}, {op = "wait", ticks = 200},
           {op = "grasp", body = "block_blue", local_point = [0.0, 0.0, 0.05]},
           {op = "move", displacement = [-0.2, 0.0, 0.0], ticks = 150}, {op = "release", ticks = 150}]

[[transfer_tasks]]
name = "blue_fling"
body = "block_blue"
local_point = [0.0, 0.0, 0.05]
goal_offset_m = [-0.25, 0.0, 0.0]
