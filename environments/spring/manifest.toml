name = "spring"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["lever"]

[correspondence]
lever = "lever"

[[probes]]
name = "lever_deflect"
body = "lever"
local_point = [0.35, 0.0, 0.0]
displacement = [-0.05, 0.0, -0.15]
ticks = 150

[[probes]]
name = "lever_return"
body = "lever"
local_point = [0.35, 0.0, 0.0]
displacement = [0.0, 0.0, 0.1]
ticks = 150

# Private expert manipulation (metric `expert`) and policy-transfer task (metric `policy_transfer`).
# No transfer task: the spring always returns to one equilibrium, so the outcome cannot depend on the policy.
[[expert_trajectories]]
name = "deflect_and_snap"
frame_ticks = 10
actions = [{op = "grasp", body = "lever", local_point = [0.35, 0.0, 0.0]},
           {op = "move", displacement = [-0.05, 0.0, -0.15], ticks = 100}, {op = "release", ticks = 300}]
