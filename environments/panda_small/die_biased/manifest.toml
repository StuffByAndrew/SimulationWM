name = "panda_small_die_biased"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = ["die"]
object_bodies = ["die"]
object_geoms = ["die_shell", "die_slug"]

# Private real-time launcher (src/sim2sim/realtime.py; generated by experiments/validation/die-scenes.py). Reset k and throw k of
# stream s use Gaussian perturbations drawn from numpy default_rng([seed, s, k]): stream 0 is the agent's session, 1 the
# evaluation trials, 2 the empirical-frequency baseline, 3 the mechanics baseline's observation noise. Protocol names and
# nominal release states are public; the seed and the perturbation sizes are not.
[launcher]
body = "die"
seed = 20261123
rest = { position = [0.000000, -0.170000, 0.430200], quat = [1, 0, 0, 0], position_m = 0.01, yaw_rad = 0.3 }
perturbation = { position_m = 0.003, angle_rad = 0.05, velocity_m_s = 0.03, angular_velocity_rad_s = 0.8 }

[[launcher.protocols]]
name = "drop"
position = [0.000000, -0.170000, 0.540000]
quat = [0.984727, 0.174108, 0.000000, 0.000000]
velocity = [0, 0, 0]
angular_velocity = [0, 0, 0]

[[launcher.protocols]]
name = "roll"
position = [-0.070000, -0.170000, 0.470000]
quat = [1.000000, 0.000000, 0.000000, 0.000000]
velocity = [0.9, 0, 0]
angular_velocity = [0, 30, 0]

[[launcher.protocols]]
name = "toss"
position = [0.060000, -0.110000, 0.530000]
quat = [0.825336, 0.399263, 0.399263, 0.000000]
velocity = [-0.5, -0.4, 0.6]
angular_velocity = [10, -14, 6]

[[launcher.protocols]]
name = "spin"
position = [0.000000, -0.230000, 0.510000]
quat = [0.453596, 0.000000, 0.630179, 0.630179]
velocity = [0.3, 0.9, 0.4]
angular_velocity = [30, 10, 40]

# Private die evaluation (src/sim2sim/die.py): fresh protocol throws streamed to the agent's predictor in real time.
[die]
deadline_s = 0.15
trials_per_protocol = 30
empirical_throws = 200
mechanics_noise = { position_m = 0.001, angle_rad = 0.02, velocity_m_s = 0.02, angular_velocity_rad_s = 0.5 }
