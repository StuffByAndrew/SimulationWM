name = "panda_small_fixture_bimodal"
scene = "scene.xml"
camera = "fixed"
graspable_bodies = []
object_bodies = ["carriage"]
object_geoms = ["carriage"]

# Private fixture evaluation (src/sim2sim/fixture.py; generated by experiments/validation/fixture-scenes.py). Held-out
# settings [compression, pressure] in dial divisions, each released `repeats` times; each chosen setting `chosen_repeats`
# times; the predictor gives `samples` stopping positions per query. Trial perturbations are seeded from `seed`.
[fixture]
seed = 2026112302
settings = [[1.79, 1.36], [0.76, 3.74], [0.33, 5.19], [1.65, 7.28], [0.76, 9.22], [2.83, 1.52], [2.45, 3.21], [3.63, 4.36], [2.49, 7.33], [2.48, 9.39], [5.24, 0.64], [4.46, 2.88], [4.79, 4.66], [5.36, 7.44], [5.65, 9.55], [7.66, 0.99], [6.77, 2.82], [7.27, 5.38], [7.15, 7.52], [7.78, 9.07], [9.18, 1.06], [9.68, 3.73], [8.92, 5.55], [8.91, 7.76], [9.19, 8.32]]
repeats = 16
chosen_repeats = 40
samples = 200
max_release_ticks = 2500
trajectory_every = 5

[[fixture.targets]]
name = "target"
lo_mm = 70.0
hi_mm = 100.0

[[fixture.targets]]
name = "narrow_target"
lo_mm = 18.0
hi_mm = 22.0
