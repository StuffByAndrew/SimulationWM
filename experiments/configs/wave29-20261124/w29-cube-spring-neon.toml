# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Reconstruct the observed scene and its physical behavior as a self-contained MuJoCo scene.xml project, using the permitted observations and interactions. Hidden tests evaluate your submissions from unobserved viewpoints and under interactions you have not tried, so run discriminating comparison experiments in both worlds, refine, and resubmit whenever your reconstruction improves. Call finish when you believe nothing about your reconstruction differs from the reference world. The cube's mass is unknown; its inertial properties (mass, centre of mass and inertia) are important to identify. The spring between the two plates is an ideal linear spring (Hooke's law only, no damping) with a stiffness of exactly 21.7 N/m."

[experiment]
name = "Wave 29 · cube_spring · cube + spring, w20 harness; original prompt; neon"
environment = "cube_spring"
execution_mode = "strict_oci"
model = "gemini-4-neon"
model_constraints = ["Use standard MuJoCo primitives and joints.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["chamfer", "center_of_mass", "density", "image_mse", "dynamics", "expert"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of cube_spring."
factor = "cube + spring, w20 harness; original prompt; neon"

[source]
scene = "environments/cube_spring/scene.xml"

[sandbox]
image = "localhost/sim2sim:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
