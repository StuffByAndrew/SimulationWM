task = "Identify the physical parameters of this scene that matter, using the permitted observations and interactions. Instead of a MuJoCo scene, submit a ZIP containing parameters.json at its root, a JSON object with exactly these keys: \"mass\": the cube's mass in kg; \"stiffness\": the spring's stiffness in N/m; \"com\": the cube's centre of mass as [x, y, z] world coordinates in m, in the scene's initial state; \"inertia\": the cube's 3x3 inertia tensor in kg m^2 about its centre of mass, in world axes, in the scene's initial state. Hidden tests compare these values with the reference world's. Resubmit whenever your estimates improve, and call finish when you believe they cannot be improved further. The spring between the two plates is an ideal linear spring (Hooke's law only, no damping). The purple block has a mass of exactly 0.0235 kg."

[experiment]
