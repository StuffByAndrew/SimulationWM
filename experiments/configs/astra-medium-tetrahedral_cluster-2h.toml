evaluate_candidate_changes = true
# Researcher-only specification. Never mount this file in the agent image.
task = "Reconstruct the observed reset scene and its physical behavior as a self-contained MuJoCo scene.xml project. Use the permitted observations and interactions, test your reconstruction, submit your best version, then finish."
record_video = false
plot_checkpoints = false
reasoning_effort = "medium"
video_fps = 10

[experiment]
name = "Astra medium · tetrahedral_cluster · two hours"
environment = "tetrahedral_cluster"
execution_mode = "development_shared_filesystem"
model = "gpt-6-astra"
model_constraints = ["Use standard MuJoCo primitives and joints.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["chamfer", "density", "image_mse"]

[experiment.physical_parameters]
scene = "Original reusable scene, with its authored MJCF physical parameters."

[source]
scene = "environments/tetrahedral_cluster/scene.xml"

[sandbox]
# No OCI settings: this deliberately selected backend uses native workers.

[development_worker]
address_space_bytes = 4294967296
data_bytes = 1073741824
file_bytes = 134217728
open_files = 256
render_backend = "egl"

[budget]
wall_only = true
wall_seconds = 7200
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 8589934592
event_log_bytes = 67108864

[simulation]
rgb = true
depth = false
calibration = true
wrench = true
width = 320
height = 240
camera = "fixed"
default_ticks = 20

[evaluation]
manifest = "manifest.toml"
source_dir = "environments/tetrahedral_cluster"
source_entrypoint = "scene.xml"
entrypoint = "scene.xml"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 180

[evaluation.reconstruction]
samples = 2048
seed = 20261029
matching_same_type = true
matching_max_distance_m = 0.08
