# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Reconstruct the observed scene and its physical behavior as a self-contained MuJoCo scene.xml project, using the permitted observations and interactions. Hidden tests evaluate your submissions from unobserved viewpoints and under interactions you have not tried, so run discriminating comparison experiments in both worlds, refine, and resubmit whenever your reconstruction improves. Call finish when you believe nothing about your reconstruction differs from the reference world."

[experiment]
name = "Wave 10 · panda/blocks_proprio · converge prompt, Panda proprioception + finger tactile, random canary colors (vs w10-panda-blocks-proprio)"
environment = "panda_blocks_proprio"
execution_mode = "strict_oci"
model = "gpt-6-astra"
model_constraints = ["Use standard MuJoCo primitives and joints for the target object; preserve the provided Panda robot fixture unchanged.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["dynamics", "chamfer", "center_of_mass", "image_mse", "friction"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of panda/blocks_proprio."
factor = "converge prompt, Panda proprioception + finger tactile, random canary colors (vs w10-panda-blocks-proprio)"

[perturbation]
seed = 2026110208
colors = "random"

[source]
scene = "environments/panda/blocks_proprio/scene.xml"

[sandbox]
image = "localhost/sim2sim-agent:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
memory = "4g"
cpus = 2
pids = 128

[budget]
wall_only = true
wall_seconds = 14400
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 8589934592
event_log_bytes = 67108864

[simulation]
robot = "panda"
rgb = false
depth = false
calibration = false
wrench = false
tactile = true
width = 320
height = 240
camera = "fixed"
default_ticks = 20

[evaluation]
manifest = "blocks_proprio/manifest.toml"
source_dir = "environments/panda"
source_entrypoint = "blocks_proprio/scene.xml"
entrypoint = "scene.xml"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 180

[evaluation.reconstruction]
samples = 2048
seed = 20261029

[inference]
