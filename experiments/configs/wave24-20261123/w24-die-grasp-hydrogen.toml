endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-4-hydrogen:generateContent"
model = "gemini-4-hydrogen"
reasoning_effort = "medium"
reasoning_summary = "auto"
api_key_env = "GEMINI_API_KEY"
