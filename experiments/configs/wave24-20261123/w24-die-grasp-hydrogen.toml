# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Investigate the die resting in the tray and build a model that predicts which face ends up uppermost when the launcher throws it with each of its protocols (task launcher_protocols; your throw action runs them). Submit the model as a predictor program (task die.predictor): during evaluation it watches new throws through the fixed camera in real time and must give its confidence allocation across the faces before the deadline after release. The world runs in real time (task realtime). Resubmit whenever your predictor improves, and call finish when you believe it cannot be improved further."

[experiment]
name = "Wave 24 · die_biased · biased die; point grasp without force sensing; real time at 25 frames/s"
environment = "die_biased"
execution_mode = "strict_oci"
model = "gemini-4-hydrogen"
model_constraints = ["Submit a ZIP whose entry point predict.py follows the predictor protocol in the task (die.predictor); it may use the Python standard library, numpy, scipy, mujoco and files you include."]
evaluation_metrics = ["die"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of die_biased."
factor = "biased die; point grasp without force sensing; real time at 25 frames/s"

[source]
scene = "environments/die_biased/scene.xml"

[sandbox]
image = "localhost/sim2sim-agent:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
memory = "4g"
cpus = 2
pids = 128

[budget]
wall_only = true
wall_seconds = 21600
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 34359738368
event_log_bytes = 67108864

[simulation]
rgb = true
depth = true
calibration = true
wrench = false
realtime = true
frame_rate = 25
movable_camera = true
width = 320
height = 240
camera = "fixed"
default_ticks = 20

[evaluation]
manifest = "manifest.toml"
source_dir = "environments/die_biased"
source_entrypoint = "scene.xml"
entrypoint = "predict.py"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 180


[tools]
sequence = true
channel = true
[inference]
