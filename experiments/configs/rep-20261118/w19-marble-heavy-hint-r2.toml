# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Reconstruct the observed scene and its physical behavior as a self-contained MuJoCo scene.xml project, using the permitted observations and interactions. Hidden tests evaluate your submissions from unobserved viewpoints and under interactions you have not tried, so run discriminating comparison experiments in both worlds, refine, and resubmit whenever your reconstruction improves. Call finish when you believe nothing about your reconstruction differs from the reference world. The closed box is not solid: it has hidden contents that can move inside it when the box moves; your reconstruction must reproduce them too."

[experiment]
name = "Wave 19 · panda_small/box_marble_heavy · Franka with joint torques, movable camera, sequence tool, contents hint"
environment = "panda_small_box_marble_heavy"
execution_mode = "strict_oci"
model = "gpt-6-astra"
model_constraints = ["Use standard MuJoCo primitives and joints for the target object; preserve the provided Panda robot fixture unchanged.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["dynamics", "chamfer", "center_of_mass", "image_mse"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of panda_small/box_marble_heavy."
factor = "Franka with joint torques, movable camera, sequence tool, contents hint"

[source]
scene = "environments/panda_small/box_marble_heavy/scene.xml"

[sandbox]
image = "localhost/sim2sim:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
memory = "4g"
cpus = 2
pids = 128

[budget]
wall_only = true
wall_seconds = 21600
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 17179869184
event_log_bytes = 67108864

[simulation]
robot = "panda"
rgb = true
depth = false
calibration = true
wrench = false
movable_camera = true
width = 320
height = 240
camera = "fixed"
default_ticks = 20

[evaluation]
manifest = "box_marble_heavy/manifest.toml"
source_dir = "environments/panda_small"
source_entrypoint = "box_marble_heavy/scene.xml"
entrypoint = "scene.xml"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 180

[evaluation.reconstruction]
samples = 2048
seed = 20261029


[tools]
sequence = true
[inference]
endpoint = "https://api.aqinference.com/v1/responses"
provider = "openai"
model = "gpt-6-astra"
reasoning_effort = "medium"
reasoning_summary = "auto"
metadata = { project = "amish-research", feature = "sim2sim-agent-eval" }
api_key_env = "INFERENCE_API_KEY"
max_calls = 2000
max_cost_usd = 44.0
cost_pool = "sim2sim-20261118"
cost_pool_usd = 161.0
cost_ledger_dir = "experiments/cost-ledger"
call_reserve_usd = 2.0
max_output_tokens = 16384
max_request_bytes = 12582912
max_response_bytes = 1048576
timeout_seconds = 300
budget_hold_seconds = 129600
