[experiment]
name = "Wave 22 · cloth_holes · cloth; point grasp with wrench, RGBD, movable camera, sequence tool"
environment = "cloth_holes"
execution_mode = "strict_oci"
model = "gemini-4-hydrogen"
model_constraints = ["Model the cloth as a MuJoCo 2D flex (for example <flexcomp dim=\"2\" dof=\"full\"> or explicit vertex bodies with three slide joints each) and everything else with standard MuJoCo primitives and joints.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
