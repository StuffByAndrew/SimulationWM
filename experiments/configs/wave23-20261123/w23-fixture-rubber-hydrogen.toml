# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = false
record_video = false
plot_checkpoints = false
task = "Calibrate the spring-powered positioning fixture on the table. A small carriage rides a rail. reset_carriage cocks its spring launcher at the compression set on the yellow compression dial and re-seats the brake pad, whose pressing force is set by the blue pressure dial; release_carriage releases the carriage, which slides along the rail until the brake stops it. Both dials are sliders on tick scales reading 0 to 10 (the observation's fixture field reports their exact readings); move them with the robot arm by pushing their pegs along their tracks. The ruler beside the rail reads the carriage position in mm at the carriage's red index line: zero is the red tick, major ticks every 50 mm and minor ticks every 10 mm, up to 250 mm. Two coloured bands on the ruler mark target regions: target (green, 70 to 100 mm) and narrow_target (orange, 18 to 22 mm). Characterize the fixture and find dial settings that stop the carriage inside each target region. Submit a ZIP project whose predictor.py defines predict(compression, pressure, n) and settings() as the submission's predictor contract specifies; it may use other files in the project, such as your own MuJoCo model of the fixture. Hidden tests run predict at other dial settings and compare it with repeated releases there, and release the carriage repeatedly at your chosen settings to count how often it stops in each target region. Call finish when you believe your predictor matches the fixture."

[experiment]
name = "Wave 23 · panda_small/fixture_rubber · positioning fixture, rubber pad; Franka with joint torques, RGBD, movable camera, sequence tool; gemini-4-hydrogen"
environment = "panda_small_fixture_rubber"
execution_mode = "strict_oci"
model = "gemini-4-hydrogen"
model_constraints = ["Submit a ZIP project with predictor.py at its root, written in Python with numpy, scipy and mujoco available; it may read other local files of the project but no native code.", "Any MuJoCo model you load into the reconstruction world must include the provided Panda robot fixture unchanged."]
