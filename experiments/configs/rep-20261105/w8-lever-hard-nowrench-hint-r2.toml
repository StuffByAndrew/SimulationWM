# Generated by generate.py — researcher-only; never mount in the agent image.
evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Reconstruct the observed scene and its physical behavior as a self-contained MuJoCo scene.xml project, using the permitted observations and interactions. Hidden tests evaluate your submissions from unobserved viewpoints and under interactions you have not tried, so run discriminating comparison experiments in both worlds, refine, and resubmit whenever your reconstruction improves. Call finish when you believe nothing about your reconstruction differs from the reference world. Make sure to estimate the hinge joint's viscous damping and dry friction loss accurately from experiments and include both in your model."

[experiment]
name = "Wave 8 · damped_lever · converge prompt, wrench disabled, task names hinge parameters (vs w7-lever-hard-nowrench)"
environment = "damped_lever"
execution_mode = "strict_oci"
model = "gpt-6-astra"
model_constraints = ["Use standard MuJoCo primitives and joints.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["hinges", "image_mse"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of damped_lever."
factor = "converge prompt, wrench disabled, task names hinge parameters (vs w7-lever-hard-nowrench)"

[perturbation]
seed = 2026110208
physics = "nonround"

[source]
scene = "environments/damped_lever/scene.xml"

[sandbox]
image = "localhost/sim2sim-agent:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
memory = "4g"
cpus = 2
pids = 128

[budget]
wall_only = true
wall_seconds = 14400
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 8589934592
event_log_bytes = 67108864

[simulation]
rgb = true
depth = false
calibration = true
wrench = false
width = 320
height = 240
camera = "fixed"
default_ticks = 20

[evaluation]
manifest = "manifest.toml"
source_dir = "environments/damped_lever"
source_entrypoint = "scene.xml"
entrypoint = "scene.xml"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 180
hinge_matching = "single"

[inference]
endpoint = "https://api.aqinference.com/v1/responses"
provider = "openai"
model = "gpt-6-astra"
reasoning_effort = "medium"
reasoning_summary = "auto"
metadata = { project = "amish-research", feature = "sim2sim-agent-eval" }
api_key_env = "INFERENCE_API_KEY"
max_calls = 2000
max_cost_usd = 44.0
cost_pool = "sim2sim-20261105"
cost_pool_usd = 700.0
cost_ledger_dir = "experiments/cost-ledger"
call_reserve_usd = 2.0
max_output_tokens = 16384
max_request_bytes = 12582912
max_response_bytes = 1048576
timeout_seconds = 300
