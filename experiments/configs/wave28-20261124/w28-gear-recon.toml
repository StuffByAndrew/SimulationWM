evaluate_candidate_changes = true
record_video = false
plot_checkpoints = false
task = "Build a MuJoCo model of this mechanism. Name the crank body `crank` and the dial hand body `hand`. Submit it as a self-contained scene.xml project, using the permitted observations and interactions; resubmit whenever your model improves, and call finish when you are done."

[experiment]
name = "Wave 28 · gear_train · gear train, stated use: recon; point grasp with wrench, RGBD, movable camera, sequence tool; gemini-4-neon"
environment = "gear_train"
execution_mode = "strict_oci"
model = "gemini-4-neon"
model_constraints = ["Use standard MuJoCo primitives and joints.", "Submit a self-contained scene.xml ZIP using only local assets, without native plugins."]
evaluation_metrics = ["gear_train"]

[experiment.physical_parameters]
scene = "Original authored MJCF physical parameters of gear_train."
factor = "gear train, stated use: recon; point grasp with wrench, RGBD, movable camera, sequence tool; gemini-4-neon"

[source]
scene = "environments/gear_train/scene.xml"

[sandbox]
image = "localhost/sim2sim:latest"
evaluator_image = "localhost/sim2sim:latest"
command = ["/usr/local/bin/python", "/opt/agent/sandbox_agent.py"]
process_limit_backend = "slurm_step"
memory = "8g"
cpus = 4
pids = 256
workspace = "1g"

[sandbox.worker]
memory = "4g"
cpus = 2
pids = 128

[budget]
wall_only = true
wall_seconds = 14400
submission_bytes = 8388608
max_message_bytes = 16777216
audit_bytes = 17179869184
event_log_bytes = 67108864

[simulation]
rgb = true
depth = true
calibration = true
wrench = true
movable_camera = true
width = 320
height = 240
camera = "fixed"
default_ticks = 20
grasp_solref = [0.002, 1]
grasp_solimp = [0.99, 0.999, 0.001, 0.5, 2]

[evaluation]
manifest = "manifest.toml"
source_dir = "environments/gear_train"
source_entrypoint = "scene.xml"
entrypoint = "scene.xml"
camera = "fixed"
width = 320
height = 240
timeout_seconds = 600


[tools]
sequence = true
[inference]
api = "gemini"
endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-4-neon:generateContent"
model = "gemini-4-neon"
reasoning_effort = "medium"
reasoning_summary = "auto"
api_key_env = "GEMINI_API_KEY"
price_usd_per_mtok = { input = 3.0, cached_input = 0.15, output = 15.0 }
max_calls = 2000
max_cost_usd = 1000000.0
cost_pool = "gemini-20261124"
cost_pool_usd = 1000000.0
cost_ledger_dir = "experiments/cost-ledger"
call_reserve_usd = 2.0
max_output_tokens = 16384
max_request_bytes = 12582912
max_response_bytes = 1048576
timeout_seconds = 300
budget_hold_seconds = 129600
provider_hold_seconds = 129600
