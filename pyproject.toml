[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2sim"
version = "0.1.0"
description = "Camera-only interactive MuJoCo reconstruction benchmark"
requires-python = ">=3.11"
dependencies = ["mujoco>=3.2,<4", "numpy>=1.26", "Pillow>=10", "imageio[ffmpeg]>=2.34"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sim2sim = "sim2sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
